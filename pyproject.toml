[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecogent"
version = "0.2.0"
description = "Ecogent - a token-efficient browser agent that reuses plans, selectors and scraping patterns"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ecogent Research"}]
dependencies = [
    "playwright>=1.58.0",
    "playwright-browser-manager @ git+https://github.com/samratpro/playwright_browser_manager.git",
    "beautifulsoup4>=4.12.0",
    "chromadb>=0.4.0",
    "dearpygui>=2.0",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "psutil>=5.9.0",
]

[project.scripts]
ecogent = "ecogent.__main__:main"

[tool.setuptools.packages.find]
include = ["ecogent*"]
