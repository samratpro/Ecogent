# /etc/nginx/sites-available/ecogent-lab   (then: ln -s ../sites-available/ecogent-lab /etc/nginx/sites-enabled/)
# Replace lab.example.com with your subdomain; certbot --nginx adds the HTTPS block.
limit_req_zone $binary_remote_addr zone=ecolab:10m rate=20r/s;

server {
    listen 80;
    server_name lab.example.com;
    client_max_body_size 64k;

    location / {
        limit_req zone=ecolab burst=60 nodelay;
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}
